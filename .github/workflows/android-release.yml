name: Android Release — Build & Deploy to Play Store

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_TARGET_SDK: '34'
  ANDROID_MIN_SDK: '22'
  CUSTOM_DOMAIN: 'drivelgicaiapp.com'
  AI_STUDIO_DOMAIN: 'drivelogicai.ai.studio'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: TypeScript lint check
  # ─────────────────────────────────────────────────────────────
  lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build AAB + APK and publish to Play Store
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build AAB / APK
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node / npm ────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── Build web assets ──────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
          CUSTOM_DOMAIN: ${{ env.CUSTOM_DOMAIN }}
          AI_STUDIO_DOMAIN: ${{ env.AI_STUDIO_DOMAIN }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID || 'sb-demo-client-id-drivelogicai' }}
          VITE_PAYPAL_ME_URL: https://www.paypal.com/paypalme/drivelogicai
          VITE_PAYPAL_SANDBOX_LOGIN: sb-buyer-drivelogicai@personal.example.com
          VITE_BTC_WALLET_ADDRESS: bc1qdrivelogicai99xge8273x0wkw0923kljhx
          VITE_BTC_WALLET_URI: bitcoin:bc1qdrivelogicai99xge8273x0wkw0923kljhx?label=DriveLogicAI%20Support

      # ── Sync Capacitor → Android ──────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── Java / JDK ────────────────────────────────────────────
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # ── Android SDK ───────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Decode or Generate release keystore ───────────────────
      - name: Prepare release keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
            echo "Keystore decoded from secret: $(wc -c < android/app/release-key.jks) bytes"
          else
            echo "KEYSTORE_BASE64 secret not supplied. Generating production-grade fallback keystore for CI..."
            keytool -genkey -v \
              -keystore android/app/release-key.jks \
              -alias "${{ secrets.KEY_ALIAS || 'drivelogicai_key' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.KEY_STORE_PASSWORD || 'MakersMarka7a8$$$' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'MakersMarka7a8$$$' }}" \
              -dname "CN=DriveLogicAI, OU=Mobile, O=DriveLogic, L=New York, S=NY, C=US"
            echo "Fallback keystore generated: $(wc -c < android/app/release-key.jks) bytes"
          fi

      # ── Gradle — Build signed release AAB ─────────────────────
      - name: Build signed release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEY_STORE_PASSWORD || 'MakersMarka7a8$$$' }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS || 'drivelogicai_key' }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || 'MakersMarka7a8$$$' }}" \
            --no-daemon

      # ── Gradle — Build signed release APK ─────────────────────
      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEY_STORE_PASSWORD || 'MakersMarka7a8$$$' }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS || 'drivelogicai_key' }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || 'MakersMarka7a8$$$' }}" \
            --no-daemon

      # ── Upload AAB & APK as build artifacts ───────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveLogicAI-release-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveLogicAI-release-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Publish to Play Store (Only when Play Service Account secret is available) ──
      - name: Publish AAB to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        if: (github.ref == 'refs/heads/main') && (secrets.PLAY_SERVICE_ACCOUNT_JSON != '')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.DriveLogicAI_chat
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

      - name: Promote to Production Track (on version tags)
        uses: r0adkll/upload-google-play@v1
        if: startsWith(github.ref, 'refs/tags/v') && (secrets.PLAY_SERVICE_ACCOUNT_JSON != '')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.DriveLogicAI_chat
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

      # ── Create GitHub Release on version tags ─────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
